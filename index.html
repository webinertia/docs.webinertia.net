<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-mode="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/assets/site.e40287.css">
<link rel="stylesheet" href="/assets/accent.4e16a5.css">
<script>
(function () {
  var stored = null;
  try {
    stored = window.localStorage.getItem('asciidoc-php-theme');
  } catch (error) {
    stored = null;
  }
  var mode = document.documentElement.getAttribute('data-theme-mode');
  var theme;
  if (stored === 'light' || stored === 'dark') {
    theme = stored;
  } else if (mode === 'light' || mode === 'dark') {
    theme = mode;
  } else {
    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
</head>
<body>

</header>

</li>

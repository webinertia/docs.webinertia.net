name: Publish docs

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [docs-source-updated]

permissions:
  contents: write

concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site repository
        uses: actions/checkout@v4
      - name: Build and deploy the site
        # This tag is the pin, not a moving branch. A release tag must carry
        # action.yml or there is no action definition to run, so advance this ref
        # deliberately to a chosen release rather than tracking a branch.
        uses: webinertia/asciidoc-php-multi-repo@1.0.0-alpha.4
        with:
          config: site.json
        env:
          DOC_DISCOVERY_TOKEN: ${{ secrets.DOC_DISCOVERY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}